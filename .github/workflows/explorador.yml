name: explorador

# Rastrear el mercado entero es caro (una petición de precio por empresa) y las
# cuentas sólo cambian cada trimestre. Con una vez al día sobra, y se hace
# después del cierre de Wall Street para que la última vela esté completa.
on:
  schedule:
    - cron: '30 22 * * 1-5'      # 22:30 UTC, de lunes a viernes
  workflow_dispatch:
    inputs:
      maximo:
        description: 'Cuántas empresas mirar con detalle'
        required: false
        default: '200'

permissions:
  contents: write

concurrency:
  group: repositorio             # nunca a la vez que un latido: comparten el repo
  cancel-in-progress: false

jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Madrid

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rastrear el mercado
        run: |
          python github/explorador.py \
            --maximo "${{ github.event.inputs.maximo || 200 }}" | tee /tmp/explorador.txt

      - name: Generar el tablero
        run: python github/tablero.py

      - name: Guardar
        run: |
          git config user.name  "bot de compraventa"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado docs
          if git diff --quiet --cached; then echo "Nada que guardar."; exit 0; fi
          git commit -m "rastreo $(date '+%Y-%m-%d')"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push

      - name: Resumen
        if: always()
        run: |
          echo '## Rastreo del mercado' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -25 /tmp/explorador.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
