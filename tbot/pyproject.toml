[project]
name = "tbot"
version = "0.1.0"
description = "Sistema de trading automatizado multi-mercado (cripto + acciones)"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.5",
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pytz>=2024.1",        # DuckDB lo necesita para timestamps con zona horaria
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]

[project.scripts]
tbot = "tbot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
